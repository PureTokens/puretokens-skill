name: Prepare pinned platform release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit or tag to package (does not create a tag or release)
        required: true
        default: main
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/executor/go.mod
          cache-dependency-path: runtime/executor/go.sum
      - run: npm run check
      - run: npm run release:validate
      # Package the committed artifacts. Rebuilding here can change bytes with
      # the runner's Go compiler and invalidate the selected commit provenance.
      - name: Package the checked-out revision
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run release:package
      - name: Require committed distribution and build inputs
        run: node -e 'const m=require("./dist/releases/release-manifest.json");if(!m.sourceCommit)throw new Error("Draft candidates cannot be promoted. Commit matching source, build inputs and generated executors first.")'
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-platform-release-candidates
          path: |
            dist/releases/*
            runtime/puretokens-skill-fetch.sh
            runtime/puretokens-skill-fetch.ps1
