name: Prepare pinned platform release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit or tag to package (does not create a tag or release)
        required: true
        default: main
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: runtime/executor/go.sum
      - run: npm run check
      - run: npm run release:validate
      # release:validate rebuilt all six artifacts with the pinned compiler and
      # compared bytes. Package the verified committed artifacts.
      - name: Package the checked-out revision
        run: GITHUB_SHA="$(git rev-parse HEAD)" npm run release:package
      - name: Verify all archives and committed source before promotion
        run: npm run release:verify -- --publishable
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-platform-release-candidates
          path: |
            dist/releases/*
